<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KyCRM 主题配色评审预览</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#1e293b;background:#f3f5f8;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{margin:0;min-width:320px}.page{max-width:1600px;margin:0 auto;padding:32px clamp(18px,3vw,48px) 60px}
    .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}.eyebrow{color:#687588;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.hero h1{font-size:clamp(25px,3vw,36px);letter-spacing:-.035em;margin:8px 0}.hero p{color:#687588;margin:0;max-width:760px;line-height:1.65;font-size:14px}.badge{white-space:nowrap;border:1px solid #d9dee8;border-radius:999px;padding:8px 12px;background:#fff;color:#566174;font-size:12px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:24px 0 16px}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid #d8deea;background:#fff;color:#596579;border-radius:999px;padding:8px 13px;font:inherit;font-size:12px;cursor:pointer}.filter[aria-pressed="true"]{background:#202b3d;border-color:#202b3d;color:#fff}.hint{font-size:12px;color:#778196}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.theme-card{--accent:#2563c4;background:#fff;border:1px solid #dce1e9;border-radius:18px;padding:18px;box-shadow:0 2px 5px #1d29390a;transition:border-color .18s,box-shadow .18s,transform .18s}.theme-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px #1d293914}.theme-card.selected{border:2px solid var(--accent);padding:17px;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.theme-name{display:flex;align-items:center;gap:10px;font-weight:750;font-size:18px}.dot{width:13px;height:13px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}.theme-meta{display:flex;gap:6px;align-items:center;color:#768195;font-size:11px}.tag{padding:4px 8px;border-radius:999px;background:#f0f2f6}.tag.new{background:#f2edff;color:#6b55bb}.choose{border:1px solid #dce1e9;background:white;color:#637086;border-radius:9px;padding:7px 10px;font:inherit;font-size:11px;cursor:pointer}.selected .choose{background:var(--accent);border-color:var(--accent);color:#fff}
    .previews{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.preview{--bg:#f3f5f6;--nav:#fff;--surface:#fff;--soft:#edf1f3;--text:#202428;--muted:#667078;--accent:#087f8c;--selected:#e3f0f1;--line:#dce2e5;--accent-text:#fff;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:13px;overflow:hidden;color:var(--text)}.mode-label{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:var(--surface);color:var(--muted);font-size:10px;font-weight:650;border-bottom:1px solid var(--line)}.mini-app{display:grid;grid-template-columns:88px minmax(0,1fr);min-height:190px}.mini-nav{background:var(--nav);border-right:1px solid var(--line);padding:10px 7px}.mini-brand{font-size:10px;font-weight:800;letter-spacing:-.02em;margin:0 0 13px 4px;white-space:nowrap}.mini-brand span{color:var(--accent);margin-left:3px}.nav-item{padding:7px 7px;border-radius:7px;font-size:9px;color:var(--muted);margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav-item.active{color:var(--accent);background:var(--selected);font-weight:700}.mini-content{padding:13px 12px;min-width:0}.crumb{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:4px 7px;color:var(--muted);font-size:8px;white-space:nowrap}.crumb b{color:var(--text)}.mini-content h3{font-size:13px;margin:12px 0 4px;letter-spacing:-.02em}.sub{font-size:8px;color:var(--muted);margin:0 0 10px;line-height:1.5}.metric{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.metric-box{padding:8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);min-width:0}.metric-box span{display:block;color:var(--muted);font-size:7px}.metric-box strong{display:block;font-size:13px;margin-top:4px}.actions{display:flex;align-items:center;gap:6px;margin-top:9px}.primary{border:0;border-radius:7px;background:var(--accent);color:var(--accent-text);padding:6px 9px;font:inherit;font-size:8px;font-weight:700}.secondary{border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);padding:5px 8px;font:inherit;font-size:8px}.status{margin-left:auto;border-radius:999px;background:#e4f3ea;color:#287346;padding:4px 6px;font-size:7px;font-weight:700}.swatches{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}.swatch{display:inline-flex;align-items:center;gap:5px;color:#758094;font-size:9px}.swatch i{width:13px;height:13px;border-radius:4px;border:1px solid #00000012;background:var(--sw)}
    .foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:20px;color:#778196;font-size:11px;line-height:1.6}.note{max-width:1000px}.count{white-space:nowrap}
    @media(max-width:900px){.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.badge{white-space:normal}.foot{align-items:flex-start;flex-direction:column}}
    @media(max-width:520px){.page{padding:22px 12px 36px}.theme-card{padding:13px}.theme-card.selected{padding:12px}.previews{gap:7px}.mini-app{grid-template-columns:72px minmax(0,1fr);min-height:175px}.mini-nav{padding:8px 5px}.mini-brand{font-size:9px}.nav-item{font-size:8px;padding:7px 5px}.mini-content{padding:11px 8px}.metric{gap:5px}.metric-box{padding:6px}.sub{font-size:7px}.swatch{font-size:8px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div><div class="eyebrow">KyCRM · Appearance review</div><h1>主题配色评审预览</h1><p>现有四套主题与六套新增候选色，同屏对比亮色、暗色的导航、选中态、按钮和内容表面。候选色用于评审，暂不代表已写入产品设置。</p></div>
      <div class="badge">10 套主题 · 每套含亮 / 暗预览 · 单击卡片可标记候选</div>
    </header>
    <div class="toolbar"><div class="filters" role="group" aria-label="筛选主题"><button class="filter" data-filter="all" aria-pressed="true">全部方案</button><button class="filter" data-filter="existing" aria-pressed="false">现有 4 套</button><button class="filter" data-filter="new" aria-pressed="false">新增候选 6 套</button></div><div class="hint">点选卡片仅用于本页评审标记，不会保存产品设置</div></div>
    <section class="grid" id="themes" aria-label="主题方案"></section>
    <footer class="foot"><div class="note">评审关注：暗色背景不要使用纯黑大面积铺底；主色负责操作与选中，成功 / 警告 / 错误状态继续使用独立语义色；正式落地前需检查文字、图标、焦点环和禁用态对比度，并验证桌面客户端与公开文档。</div><div class="count" id="count">显示 10 套</div></footer>
  </main>
  <script>
    const themes=[
      {id:'classic-gold',name:'经典金',group:'existing',accent:['#d49a3d','#ffd47d'],bg:['#f7efe4','#050505'],nav:['#fffcf7','#050505'],surface:['#fffaf3','#111111'],soft:['#fcf6ed','#161616'],text:['#34281a','#ffffff'],muted:['#6f573a','#b3b3b3'],selected:['#f7ead4','#24201a'],line:['#ead9c5','#39322a'],buttonText:['#34281a','#34281a']},
      {id:'business-blue',name:'商务蓝',group:'existing',accent:['#2563c4','#8bb8ff'],bg:['#eff4fb','#0a1220'],nav:['#f9fbff','#101d31'],surface:['#ffffff','#16253c'],soft:['#e7eef9','#203149'],text:['#20324e','#ffffff'],muted:['#586b85','#b0bfd3'],selected:['#dce7f7','#203149'],line:['#d4deec','#30435e'],buttonText:['#ffffff','#13201a']},
      {id:'jade-green',name:'翡翠绿',group:'existing',accent:['#167554','#76d4ae'],bg:['#eef6f1','#091711'],nav:['#f8fcf9','#0d1d16'],surface:['#fbfefa','#13271d'],soft:['#e8f2eb','#1a3024'],text:['#193b2c','#f1fff6'],muted:['#526d5c','#afc7b8'],selected:['#dcece1','#1a3024'],line:['#d1e1d6','#304e3c'],buttonText:['#ffffff','#13201a']},
      {id:'graphite-cyan',name:'石墨青',group:'existing',accent:['#087f8c','#35d1db'],bg:['#f3f5f6','#181818'],nav:['#fafbfc','#202020'],surface:['#ffffff','#262626'],soft:['#edf1f3','#353535'],text:['#202428','#f3f3f3'],muted:['#667078','#ababab'],selected:['#e4f3f4','#303030'],line:['#dce2e5','#3a3a3a'],buttonText:['#ffffff','#102629']},
      {id:'violet-dusk',name:'暮云紫',group:'new',accent:['#6c56c8','#b5a3ff'],bg:['#f5f3fb','#15131c'],nav:['#fcfbfe','#201d29'],surface:['#ffffff','#282432'],soft:['#ece8f7','#332e40'],text:['#29243a','#f4f0ff'],muted:['#706a80','#bcb5cd'],selected:['#e9e4f5','#30283f'],line:['#ddd7eb','#40394f'],buttonText:['#ffffff','#211b34']},
      {id:'terracotta',name:'赤陶橙',group:'new',accent:['#b7563e','#ff9d83'],bg:['#faf3f0','#1b1311'],nav:['#fffaf7','#241916'],surface:['#fffefd','#2d1f1b'],soft:['#f2e6e1','#392923'],text:['#34251f','#fff1eb'],muted:['#79645d','#c8aaa0'],selected:['#f2e4df','#3a2923'],line:['#ead8d1','#50372f'],buttonText:['#ffffff','#34201b']},
      {id:'sky-mist',name:'天青蓝',group:'new',accent:['#347bac','#85bce8'],bg:['#f1f6fa','#121a22'],nav:['#fbfdff','#19232d'],surface:['#ffffff','#222e39'],soft:['#e7f0f7','#2b3a47'],text:['#243546','#f0f6fb'],muted:['#617487','#aebdca'],selected:['#e0edf6','#263b4e'],line:['#d6e2eb','#364754'],buttonText:['#ffffff','#172b3c']},
      {id:'pine-forest',name:'松柏绿',group:'new',accent:['#467456','#91c7a2'],bg:['#f2f6f2','#121a16'],nav:['#fbfdfb','#19241d'],surface:['#ffffff','#222f26'],soft:['#e8f0e8','#2b3a30'],text:['#28392d','#f0f7f0'],muted:['#657769','#b1c2b4'],selected:['#e1ece2','#293d30'],line:['#d8e3d9','#394a3d'],buttonText:['#ffffff','#1c3023']},
      {id:'camellia-red',name:'山茶红',group:'new',accent:['#b14c5b','#f094a0'],bg:['#f9f2f3','#1c1216'],nav:['#fdf9fa','#25191d'],surface:['#ffffff','#2e2025'],soft:['#f2e5e7','#3b2a30'],text:['#39272b','#fff0f1'],muted:['#7b6569','#c8aeb2'],selected:['#f0e1e4','#3b272e'],line:['#e8d7da','#4b363d'],buttonText:['#ffffff','#351f24']},
      {id:'slate-fog',name:'雾凇灰',group:'new',accent:['#5d7187','#afc3d8'],bg:['#f1f4f7','#121820'],nav:['#fbfcfd','#1a222c'],surface:['#ffffff','#252f3a'],soft:['#e7edf2','#303d49'],text:['#263341','#f0f4f8'],muted:['#66788a','#b2bfcb'],selected:['#dfe8ef','#2c3b49'],line:['#d7e1e9','#3a4a58'],buttonText:['#ffffff','#1a2733']}
    ];
    let activeFilter='all',selectedId='';
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function preview(t,dark){const i=dark?1:0,vars=`--bg:${t.bg[i]};--nav:${t.nav[i]};--surface:${t.surface[i]};--soft:${t.soft[i]};--text:${t.text[i]};--muted:${t.muted[i]};--accent:${t.accent[i]};--selected:${t.selected[i]};--line:${t.line[i]};--accent-text:${t.buttonText[i]}`;return `<div class="preview" style="${vars}"><div class="mode-label"><span>${dark?'暗色模式':'亮色模式'}</span><span>${t.accent[i]}</span></div><div class="mini-app"><aside class="mini-nav"><div class="mini-brand">KyCRM<span>✦</span></div><div class="nav-item active">▦　工作台</div><div class="nav-item">◫　客户管理</div><div class="nav-item">◷　数据分析</div><div class="nav-item">⚙　系统设置</div></aside><div class="mini-content"><div class="crumb">平台后台　/　<b>工作台</b></div><h3>工作概览</h3><p class="sub">今日业务数据与待处理事项</p><div class="metric"><div class="metric-box"><span>新增客户</span><strong>128</strong></div><div class="metric-box"><span>跟进任务</span><strong>36</strong></div></div><div class="actions"><button class="primary">新建客户</button><button class="secondary">查看报表</button><span class="status">运行正常</span></div></div></div></div>`}
    function render(){const grid=document.getElementById('themes'),list=themes.filter(t=>activeFilter==='all'||t.group===activeFilter);grid.innerHTML=list.map(t=>`<article class="theme-card ${selectedId===t.id?'selected':''}" style="--accent:${t.accent[0]}" data-id="${esc(t.id)}"><div class="card-head"><div><div class="theme-name"><i class="dot"></i>${esc(t.name)}</div></div><div class="theme-meta"><span class="tag ${t.group==='new'?'new':''}">${t.group==='new'?'新增候选':'现有主题'}</span><button class="choose" type="button">${selectedId===t.id?'已标记':'标记评审'}</button></div></div><div class="previews">${preview(t,false)}${preview(t,true)}</div><div class="swatches"><span class="swatch"><i style="--sw:${t.accent[0]}"></i>亮色主色</span><span class="swatch"><i style="--sw:${t.accent[1]}"></i>暗色主色</span><span class="swatch"><i style="--sw:${t.bg[0]}"></i>亮色背景</span><span class="swatch"><i style="--sw:${t.bg[1]}"></i>暗色背景</span></div></article>`).join('');document.getElementById('count').textContent=`显示 ${list.length} 套`}
    document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{activeFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));
    document.getElementById('themes').addEventListener('click',e=>{const card=e.target.closest('.theme-card');if(card){selectedId=selectedId===card.dataset.id?'':card.dataset.id;render()}});render();
  </script>
</body>
</html>
