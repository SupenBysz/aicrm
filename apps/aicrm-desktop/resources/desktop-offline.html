<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>客户端离线</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { min-height: 100%; margin: 0; }
      body {
        background: #fff8ef;
        color: #34281a;
        font: 14px/1.6 system-ui, sans-serif;
      }
      main { padding: 64px 24px; text-align: center; }
      h1 { color: #34281a; font-size: 22px; line-height: 1.4; margin: 0 0 12px; }
      p { color: #574631; margin: 8px 0; }
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 28px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 0 8px;
        box-sizing: border-box;
        border-top: 1px solid #b8a88f;
        background: #fff8ef;
        color: #574631;
        font-size: 12px;
      }
      button { font: inherit; color: inherit; background: transparent; border: 0; cursor: pointer; }
      footer span, footer button { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
      @media (prefers-color-scheme: dark) {
        body { background: #141414; color: #f2f2f2; }
        h1 { color: #ffffff; }
        p { color: #d0d0d0; }
        footer { border-top-color: #555; background: #141414; color: #d0d0d0; }
      }
    </style>
  </head>
  <body>
    <main role="status">
      <h1>网络不可用</h1>
      <p>当前仅显示本地客户端状态，后台业务暂不可用。</p>
      <p>恢复连接后，请从应用菜单“视图 → 重试后台连接”重新打开。</p>
    </main>
    <footer id="plugin-status" aria-label="客户端状态栏"></footer>
  </body>
</html>
