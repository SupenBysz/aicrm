# kww 独立开发入口，仅通过服务器回环地址或 SSH 转发访问。
worker_processes 1;
pid /run/kww-nginx/nginx.pid;
error_log /var/log/kww/nginx-error.log warn;
events { worker_connections 1024; }
http {
  include /opt/kww/toolchain/nginx/etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  log_format kww '$time_iso8601 $request_method $status $upstream_addr $request_time';
  access_log /var/log/kww/nginx-access.log kww;
  client_body_temp_path /var/lib/kww/nginx/client;
  proxy_temp_path /var/lib/kww/nginx/proxy;
  fastcgi_temp_path /var/lib/kww/nginx/fastcgi;
  uwsgi_temp_path /var/lib/kww/nginx/uwsgi;
  scgi_temp_path /var/lib/kww/nginx/scgi;
  server {
    listen 127.0.0.1:18180;
    server_name localhost 127.0.0.1;
    root /data/kww.org.cn/runtime/www/ky-admin-host;
    index index.html;
    client_max_body_size 8m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # 默认传递 Authorization、工作区、请求 ID、幂等键和 SSE 游标等请求头。
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /legal/ { try_files $uri /public-document.html; add_header Cache-Control "no-cache"; }
    location = /public-document.html { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location ~ /\. { return 404; }
    location /internal/ { return 404; }
    # ky-auth-service：与实际注册路由保持一致。
    location ~ ^(/api/v1/auth/bootstrap|/api/v1/auth/change\-password|/api/v1/auth/login|/api/v1/auth/logout|/api/v1/auth/me|/api/v1/auth/register|/api/v1/login\-logs|/api/v1/platform/users)(/|:|$) {
      proxy_pass http://127.0.0.1:18081;
    }
    location ~ ^/api/v1/(public/(documents/|document-links)|platform/(documents|document-links)) { proxy_pass http://127.0.0.1:18082; }
    location = /api/v1/platform/plugin-management/service-health { proxy_pass http://127.0.0.1:18082; }
    # ky-org-service：与实际注册路由保持一致。
    location ~ ^(/api/v1/agency/enterprises|/api/v1/agency/workbench/summary|/api/v1/departments|/api/v1/dictionaries|/api/v1/enterprise/workbench/summary|/api/v1/organizations/current|/api/v1/platform/agencies|/api/v1/platform/app\-version\-rules|/api/v1/platform/email/accounts|/api/v1/platform/email/identities|/api/v1/platform/email/templates|/api/v1/platform/enterprises|/api/v1/platform/notification\-templates|/api/v1/platform/platform\-profile|/api/v1/platform/qualifications|/api/v1/platform/sms/accounts|/api/v1/platform/sms/signatures|/api/v1/platform/sms/templates|/api/v1/platform/storage\-setting|/api/v1/platform/system\-settings|/api/v1/platform/workbench/summary|/api/v1/public/app\-version\-check|/api/v1/public/platform\-profile|/api/v1/qualifications|/api/v1/settings|/api/v1/teams)(/|:|$) {
      proxy_pass http://127.0.0.1:18082;
    }
    # ky-membership-service：与实际注册路由保持一致。
    location ~ ^(/api/v1/announcements|/api/v1/audit\-logs|/api/v1/data\-scopes|/api/v1/invitations|/api/v1/memberships|/api/v1/notifications|/api/v1/permissions|/api/v1/platform/organizations|/api/v1/public/invitations|/api/v1/roles|/api/v1/workspace/members)(/|:|$) {
      proxy_pass http://127.0.0.1:18083;
    }
    # ky-matrix-account-service：与实际注册路由保持一致。
    location ~ ^(/api/v1/matrix\-account\-login\-attempts|/api/v1/matrix\-account\-login\-scripts|/api/v1/matrix\-account\-web\-spaces|/api/v1/matrix\-accounts)(/|:|$) {
      proxy_pass http://127.0.0.1:18085;
    }
    # ky-ai-model-service：与实际注册路由保持一致。
    location ~ ^(/api/v1/ai\-executor\-runs|/api/v1/ai\-executor\-tasks|/api/v1/ai\-executors|/api/v1/ai\-models/models|/api/v1/ai\-models/providers|/api/v1/ai\-models/settings)(/|:|$) {
      proxy_pass http://127.0.0.1:18086;
    }
    # 执行器控制面尚未切换；公开 legacy 路由由 AI 服务按既有门禁处理。
    # 未知 API 不能落入 SPA 并伪装成成功的 HTML 响应。
    location /api/ { default_type application/json; return 404 '{"error":{"code":"not_found"}}'; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
