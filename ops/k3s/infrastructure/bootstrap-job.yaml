apiVersion: batch/v1
kind: Job
metadata:
  name: kycrm-bootstrap-v2
  namespace: kycrm-staging
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bootstrap
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        command:
        - bash
        - -c
        - for i in $(seq 1 30); do pg_isready -h postgres -U postgres && break; sleep
          2; done; exec psql -X -h postgres -U postgres -d postgres -f /sql/bootstrap.sql
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: kycrm-database-admin
              key: password
        envFrom:
        - secretRef:
            name: kycrm-database-bootstrap
        volumeMounts:
        - name: sql
          mountPath: /sql
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: sql
        configMap:
          name: kycrm-bootstrap-sql
