apiVersion: batch/v1
kind: CronJob
metadata:
  name: kycrm-database-backup
  namespace: kycrm-staging
spec:
  schedule: 0 */6 * * *
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: database-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
            command:
            - bash
            - -c
            - 'set -euo pipefail

              umask 077

              for attempt in $(seq 1 45); do
                pg_isready -q -t 1 -d "$KY_TENANT_DATABASE_URL" && break;
                sleep 1;
              done;
              pg_isready -q -t 1 -d "$KY_TENANT_DATABASE_URL"

              name="/backups/kycrm-$(date -u +%Y%m%dT%H%M%SZ).dump"

              pg_dump "$KY_TENANT_DATABASE_URL" --format=custom --file="$name.partial"

              pg_restore --list "$name.partial" >/dev/null

              mv "$name.partial" "$name"

              sha256sum "$name" > "$name.sha256"

              find /backups -maxdepth 1 -type f -name ''kycrm-*'' -mtime +14 -delete

              printf ''Backup completed: %s\n'' "${name##*/}"

              '
            envFrom:
            - secretRef:
                name: kycrm-migrator
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: backups
              mountPath: /backups
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: database-backups
