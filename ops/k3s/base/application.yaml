      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: org
  template:
    metadata:
      labels:
        app: org
        app.kubernetes.io/part-of: kycrm
    spec:
      serviceAccountName: kycrm-app
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ghcr-read
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 65532
      terminationGracePeriodSeconds: 30
      containers:
      - name: org
        image: ghcr.io/supenbysz/kycrm-org:UNRELEASED
        ports:
        - containerPort: 18082
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          failureThreshold: 30
          periodSeconds: 5
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: storage
          mountPath: /var/lib/kycrm
        env:
        - name: KY_ORG_SERVICE_HTTP_ADDR
          value: :18082
        envFrom:
        - configMapRef:
            name: kycrm-config
        - secretRef:
            name: kycrm-runtime
        workingDir: /var/lib/kycrm
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: storage
        persistentVolumeClaim:
          claimName: application-storage
---
apiVersion: v1
kind: Service
metadata:
  name: org
spec:
  selector:
    app: org
  ports:
  - name: http
    port: 18082
    targetPort: http
